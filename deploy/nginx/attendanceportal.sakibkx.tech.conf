# nginx site for the web app (static Expo web build). certbot adds HTTPS.
# The build lives in the frontend repo folder: npm run build:web (creates web-build/)
# Install:  sudo cp deploy/nginx/attendanceportal.sakibkx.tech.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/attendanceportal.sakibkx.tech.conf /etc/nginx/sites-enabled/
server {
    listen 80;
    listen [::]:80;
    server_name attendanceportal.sakibkx.tech;

    root /var/www/attendanceportal-frontend/web-build;
    index index.html;

    # Bundles have content hashes in their names: cache them for a long time
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: every route is served by index.html (never cached)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
