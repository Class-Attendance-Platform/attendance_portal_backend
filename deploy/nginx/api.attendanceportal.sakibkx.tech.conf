# nginx site for the API. certbot adds the HTTPS (443) part and the redirect.
# Install:  sudo cp deploy/nginx/api.attendanceportal.sakibkx.tech.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/api.attendanceportal.sakibkx.tech.conf /etc/nginx/sites-enabled/
server {
    listen 80;
    listen [::]:80;
    server_name api.attendanceportal.sakibkx.tech;

    # Face attendance uploads up to 3 class photos of 10 MB each
    client_max_body_size 32M;

    location / {
        proxy_pass http://unix:/run/attendanceportal-api/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}
